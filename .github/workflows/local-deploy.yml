name: Local CI Build Test

on:
  schedule:
    - cron: "0 13 * * *"  # Runs every day at 6:30 PM IST
  push:
    branches:
      - build-schedule

jobs:
  build_and_copy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Copy Build Folder to Local (Simulate Deployment)
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
