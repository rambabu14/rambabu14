name: Local CI Build Test

on:
  schedule:
    - cron: "0 13 * * *"  # 6:30 PM IST
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build_and_copy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./next-js/my-scheduled-app  # adjust to your actual repo path

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
