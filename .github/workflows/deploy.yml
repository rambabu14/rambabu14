name: Deploy

on:
  workflow_dispatch: {}
  schedule:
    # Every day at 02:00 UTC (07:30 AM IST)
    - cron: '0 2 * * *'
  push:
    branches: [ "main" ]

env:
  LOCAL_TEST: "true" # 👈 Set to false later for real deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
          check-latest: true

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: build_artifact

      - name: Show contents
        run: ls -la build_artifact || true

      - name: Local deploy simulation
        if: env.LOCAL_TEST == 'true'
        run: |
          mkdir -p ./local-deploy
          rm -rf ./local-deploy/*
          cp -r build_artifact/. ./local-deploy
          echo "✅ Build copied to ./local-deploy"

      - name: Real deploy placeholder
        if: env.LOCAL_TEST != 'true'
        run: echo "Deploy to servers goes here later."
