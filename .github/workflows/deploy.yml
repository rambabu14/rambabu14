name: Deploy

on:
  workflow_dispatch: {}
  schedule:
    # Example: daily at 02:00 UTC. Change cron as required.
    - cron: '0 2 * * *'
  push:
    branches: [ "main" ]

env:
  # Set to "true" when you want to test deploy locally (on runner) instead of real servers.
  LOCAL_TEST: "true"

jobs:
  download-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (needed for any repo scripts)
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: build_artifact

      - name: Show artifact contents (debug)
        run: |
          ls -la build_artifact || true

      - name: Local deploy simulation (copies .next to ./local-deploy)
        if: env.LOCAL_TEST == 'true'
        run: |
          echo "LOCAL_TEST=true -> simulate deploy to local folder"
          mkdir -p ./local-deploy
          rm -rf ./local-deploy/*
          cp -r build_artifact/.next ./local-deploy
          echo "Build copied to ./local-deploy/.next"
          echo "You can inspect ./local-deploy on the runner workspace"

      - name: Deploy to servers (placeholder)
        if: env.LOCAL_TEST != 'true'
        run: |
          echo "Deploy to actual servers should go here."
          echo "Use rsync or scp to copy build_artifact/.next to your servers and restart service."
          exit 1
