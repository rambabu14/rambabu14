name: Deploy

# Trigger when CI - build workflow completes successfully
on:
  workflow_run:
    workflows: ["CI - build"]
    types:
      - completed

env:
  LOCAL_TEST: "true" # 👈 Set false later for real server deploy

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
          check-latest: true

      # 🟢 Automatically download artifact from the CI run that triggered this
      - name: Download build artifact from CI
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: "CI - build"
          workflow_conclusion: success
          run_id: ${{ github.event.workflow_run.id }}
          name: next-build
          path: build_artifact

      - name: Show artifact contents
        run: ls -la build_artifact || true

      - name: Local deploy simulation
        if: env.LOCAL_TEST == 'true'
        run: |
          mkdir -p ./local-deploy
          rm -rf ./local-deploy/*
          cp -r build_artifact/. ./local-deploy
          echo "✅ Local deploy successful. Files in ./local-deploy"
      
      - name: Real deploy placeholder
        if: env.LOCAL_TEST != 'true'
        run: echo "🚀 Real deployment to servers will go here later."
