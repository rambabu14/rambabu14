name: CI - build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'   # Next.js 15+ needs Node >=20.9.0

      - name: Install dependencies
        run: npm ci
        working-directory: ./next-js/my-scheduled-app

      - name: Build project
        run: npm run build
        working-directory: ./next-js/my-scheduled-app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: ./next-js/my-scheduled-app/.next
